<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    
    <div class="container-login">
        <header class="header">
            <h1>Login Page</h1>
            <nav>
                <ul class="links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="postvideo.html">Post Video</a></li>
                    <li><a href="registration.html">Registration</a></li>
                    <li><a href="viewpost.html">View Post</a></li>
                </ul>
            </nav>
        </header>

        <main class="login-main" role="main">
            <form id="loginForm">
                <h2>Login</h2>
                <div>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username">
                    <span id="usernameValidation" class="validation-message"></span>
                </div>
                
                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                    <span id="passwordValidation" class="validation-message"></span>
                </div>
                
                
                <button type="submit">Login</button>
            </form>
        </main>

        <footer class="footer">
            Max Cole @ SFSU
        </footer>

    </div>
